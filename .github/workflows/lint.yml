name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LINT_PATHS: srl tests examples templates

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      # Only the linters themselves -- no torch/package install needed.
      # Versions must match pyproject's `lint` extra and .pre-commit-config.yaml.
      - name: Ruff (lint)
        run: uvx ruff@0.16.2 check --output-format=github $LINT_PATHS

      - name: Black (format check)
        # Formatting is still enforced with black. Migrating to `ruff format`
        # is a planned follow-up (it would reformat ~16 files in srl/ and
        # tests/); see CONTRIBUTING.md, "Formatting".
        run: uvx black@26.5.1 --check --diff $LINT_PATHS

  mypy:
    # Non-blocking for now: baseline is ~281 errors (Phase 0, Nov 2026).
    # Ratchet down, then drop continue-on-error once the baseline is clean.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install package and mypy
        run: |
          uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system -e . "mypy>=1.8.0" types-PyYAML

      - name: mypy (non-blocking, baseline ~281 errors)
        run: mypy srl
