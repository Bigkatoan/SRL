# SAC on FetchPush-v4  (obs_flat=31, act=4)
# Flat obs = [observation(25) | achieved_goal(3) | desired_goal(3)]
# SAC + HER (future, k=4) with observation normalization.
# Target: success_rate > 0.80 (convergence ~2M steps)

env_id: "FetchPush-v4"
env_type: "goal"

algo: sac

encoders:
  - name: actor_state_enc
    type: mlp
    input_dim: 31
    latent_dim: 256
    layers:
      - {out_features: 256, activation: relu, norm: layer_norm}
      - {out_features: 256, activation: relu, norm: layer_norm}
  - name: critic_state_enc
    type: mlp
    input_dim: 31
    latent_dim: 256
    layers:
      - {out_features: 256, activation: relu, norm: layer_norm}
      - {out_features: 256, activation: relu, norm: layer_norm}

flows:
  - "actor_state_enc -> actor"
  - "critic_state_enc -> critic"

actor:
  name: actor
  type: squashed_gaussian
  action_dim: 4
  log_std_min: -5.0
  log_std_max: 2.0
  layers:
    - {out_features: 256, activation: relu, norm: layer_norm}

critic:
  name: critic
  type: twin_q
  action_dim: 4
  layers:
    - {out_features: 256, activation: relu, norm: layer_norm}

losses:
  - {name: sac_q,           weight: 1.0}
  - {name: sac_policy,      weight: 1.0}
  - {name: sac_temperature, weight: 1.0}

train:
  total_steps: 2_000_000
  lr_actor: 3e-4
  lr_critic: 3e-4
  lr_alpha: 3e-4
  buffer_size: 1_000_000
  batch_size: 256
  gamma: 0.98
  tau: 0.005
  learning_starts: 1_000
  # HER "cycle" recipe: 40 gradient steps per 50-step episode.
  train_freq: 50
  gradient_steps: 40

  # ── Hindsight Experience Replay ──────────────────────────────────────────
  # Sparse-reward manipulation is not learnable without relabelling (plain
  # replay: FetchSlide stayed at 0% success while Q diverged to ~+1290).
  use_her: true
  her_strategy: "future"
  # k = 4 relabelled goals per real one -> her_ratio = k / (k + 1) = 0.8.
  her_ratio: 0.8
  her_max_episode_len: 50

  # Running mean/std normalization of [observation | achieved | desired],
  # clipped to +-5 (as in the original HER implementation).
  normalize_obs: true
  obs_norm_clip: 5.0

  env_id: "FetchPush-v4"
  include_goal: true
