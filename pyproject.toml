[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "srl-rl"
version = "0.2.0"
description = "Simple Reinforcement Learning Library — continuous action spaces, multi-modal, config-driven"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Tran Dang An", email = "bigkatoan@gmail.com" }]
keywords = ["reinforcement-learning", "deep-learning", "ppo", "sac", "ddpg", "gymnasium", "isaaclab", "ros2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "gymnasium>=0.29.0",
    "tensorboard>=2.13.0",
    "pyyaml>=6.0",
    "safetensors>=0.4.0",
    # Logger.enable_plots defaults to True, so plotting is on-by-default
    # behavior, not an opt-in extra -- it needs to actually be installed by
    # `pip install srl-rl` rather than silently no-op'ing (see the
    # try/except ImportError around its use in utils/logger.py).
    "matplotlib>=3.5.0",
]

[project.urls]
Homepage      = "https://github.com/Bigkatoan/SRL"
Documentation = "https://bigkatoan.github.io/SRL"
Repository    = "https://github.com/Bigkatoan/SRL"
Issues        = "https://github.com/Bigkatoan/SRL/issues"
Changelog     = "https://github.com/Bigkatoan/SRL/releases"

[project.optional-dependencies]
mujoco = ["gymnasium[mujoco]>=0.29.0", "mujoco>=3.0.0"]
box2d = ["box2d>=2.3.10", "pygame>=2.5.0"]
robotics = ["gymnasium-robotics>=1.2.0"]
racecar = [
    "racecar-gym @ git+https://github.com/axelbr/racecar_gym.git ; python_version < '3.11'",
    "yamldataclassconfig==1.5.0 ; python_version < '3.11'",
    "pybullet>=3.2.5",
]
all = [
    "gymnasium[mujoco]>=0.29.0",
    "mujoco>=3.0.0",
    "box2d>=2.3.10",
    "pygame>=2.5.0",
    "gymnasium-robotics>=1.2.0",
    "pybullet>=3.2.5",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    # Pinned exactly (not >=): both tools' default/inferred rule sets have
    # changed across releases in ways that silently changed what CI enforces
    # (see [tool.ruff.lint] select below for the same reasoning applied to
    # ruff's rule selection). Bump deliberately, not as a side effect of a
    # routine `pip install -U`.
    "black==26.5.1",
    "ruff==0.16.2",
    "mypy>=1.8.0",
    # Docs: Sphinx + sphinx-book-theme (matches mjlab's doc setup), with MyST
    # so existing docs stay Markdown instead of a full RST rewrite.
    "sphinx>=7.2.0",
    "sphinx-book-theme>=1.1.0",
    "myst-parser>=2.0.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.5.0",
    "sphinx-tabs>=3.4.0",
]

[project.scripts]
srl-train = "srl.cli.train:main"
srl-benchmark = "srl.cli.benchmark:main"
srl-visualize = "srl.cli.visualize:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["srl*"]

[tool.setuptools.package-data]
"srl" = ["py.typed"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Explicit select so the enforced rule set is pinned by this file, not by
# whatever ruff's "default" happens to be for the installed version -- ruff's
# default rule set has changed across releases, which silently changed what
# CI enforced. E/F/I/UP/B is a conventional, low-noise baseline (pycodestyle
# errors, pyflakes, isort, pyupgrade, bugbear); intentionally excludes
# flake8-bandit (S) and pylint (PLR) -- those flag legitimate patterns used
# throughout this codebase (broad except around optional/GPU-only imports,
# `import torch.nn as nn`) and would need per-call-site judgement, not a
# mechanical fix.
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
exclude = ["build", "matrix_runs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
