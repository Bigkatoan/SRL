name: Deploy Sphinx docs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-docs-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-docs-

      - name: Install SRL and docs dependencies
        run: |
          pip install --upgrade pip
          # Real (not --no-deps) install: unlike the old mkdocstrings setup
          # (which used griffe's static AST parsing, no import needed),
          # sphinx.ext.autodoc imports the actual modules to introspect them
          # -- torch/numpy/gymnasium etc. need to be genuinely importable.
          # Heavy optional simulator backends (isaaclab, mjlab, mujoco,
          # viser, racecar_gym, ...) are mocked in docs/conf.py's
          # autodoc_mock_imports instead of installed here.
          pip install -e ".[dev]"

      - name: Build docs
        run: |
          python -m sphinx -b html docs docs/_build/html --keep-going

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
