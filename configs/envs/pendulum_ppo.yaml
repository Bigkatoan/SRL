# PPO on Pendulum-v1  (obs=3, act=1; dims resolved from the env: `auto`)
# Hyperparameters follow rl-baselines3-zoo's Pendulum-v1 PPO (minus gSDE):
# gamma 0.9, lr 1e-3, n_steps 1024 x 4 envs, 10 epochs, obs+reward
# normalisation. Target eval return > -400 by ~200k steps (~-200 when solved).

schema_version: 1

env_id: "Pendulum-v1"
env_type: "flat"

algo: ppo

encoders:
  - name: actor_state_enc
    type: mlp
    input_dim: auto
    latent_dim: 64
    layers:
      - {out_features: 64, activation: tanh, norm: none}
      - {out_features: 64, activation: tanh, norm: none}
  - name: critic_state_enc
    type: mlp
    input_dim: auto
    latent_dim: 64
    layers:
      - {out_features: 64, activation: tanh, norm: none}
      - {out_features: 64, activation: tanh, norm: none}

flows:
  - "actor_state_enc -> actor"
  - "critic_state_enc -> critic"

actor:
  name: actor
  type: gaussian
  action_dim: auto
  log_std_init: -0.5
  layers:
    - {out_features: 64, activation: tanh, norm: none}

critic:
  name: critic
  type: value
  layers:
    - {out_features: 64, activation: tanh, norm: none}

train:
  total_steps: 200_000
  n_envs: 4
  n_steps: 1024
  batch_size: 64
  n_epochs: 10
  lr: 1e-3
  gamma: 0.9
  gae_lambda: 0.95
  clip_range: 0.2
  entropy_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  normalize_obs: true
  normalize_reward: true
  eval_freq: 20_000
  eval_episodes: 10
