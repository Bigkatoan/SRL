name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Nightly learning-regression run (03:17 UTC).
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # `labeled` runs only start the learning job: give them their own group so they
  # never cancel the unit-test matrix of the same PR.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && 'label' || 'push' }}
  cancel-in-progress: true

env:
  # CPU-only torch wheels (~200 MB) instead of the default CUDA build (~2-3 GB).
  TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
  UV_SYSTEM_PYTHON: "1"
  MPLBACKEND: Agg

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    # The `labeled` trigger exists only to start the learning job below;
    # don't re-run the whole unit matrix every time a label is added.
    if: github.event_name != 'schedule' && github.event.action != 'labeled'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        extras: ["test,mujoco,robotics"]
        # Coverage (and its fail_under gate) is measured on Linux, where the
        # optional sim backends are installed; macOS/Windows are smoke jobs.
        pytest-args: ["--cov=srl --cov-report=xml --cov-report=term"]
        include:
          - os: macos-latest
            python-version: "3.12"
            extras: "test"
            pytest-args: ""
          - os: windows-latest
            python-version: "3.12"
            extras: "test"
            pytest-args: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools-scm needs tags to compute the version

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install CPU-only torch
        if: runner.os != 'macOS'  # macOS wheels on PyPI are already CPU/MPS-only
        run: uv pip install torch --index-url "$TORCH_INDEX_URL"
        shell: bash

      - name: Install package and test dependencies
        run: uv pip install -e ".[${{ matrix.extras }}]"
        shell: bash

      - name: Run unit tests
        run: python -m pytest -m "not slow and not gpu" ${{ matrix.pytest-args }}
        shell: bash

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && !cancelled()
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: unit
          # Optional: public repos can upload tokenless; set CODECOV_TOKEN
          # in repo secrets to avoid rate limits / for private forks.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  learning:
    name: learning regression (slow)
    # Nightly, on manual dispatch, or on PRs carrying the `run-slow` label.
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-slow'))
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: |
          uv pip install torch --index-url "$TORCH_INDEX_URL"
          uv pip install -e ".[test,mujoco,robotics]"

      - name: Run learning tests
        # Learning runs take minutes each; override the 300 s unit-test cap.
        run: python -m pytest -m slow --timeout=3600 -v --durations=0
